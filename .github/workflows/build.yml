name: Mod Build

on: [push]

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Build Mod
        run: ./gradlew remapJar
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/libs/*.jar